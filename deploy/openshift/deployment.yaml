apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-qiskit-agents
  namespace: openclaw
  labels:
    app: llama-qiskit-agents
    app.kubernetes.io/part-of: quantum-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-qiskit-agents
  strategy:
    type: RollingUpdate          # stateless: pode fazer rolling update
  template:
    metadata:
      labels:
        app: llama-qiskit-agents
    spec:
      containers:
        - name: api
          # Troque pela sua imagem após o build:
          #   oc new-build --name=llama-qiskit-agents --binary -n openclaw
          #   oc start-build llama-qiskit-agents --from-dir=. --follow -n openclaw
          image: image-registry.openshift-image-registry.svc:5000/openclaw/llama-qiskit-agents:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: CORS_ORIGINS
              value: "http://localhost:18789,https://openclaw-openclaw.apps.ocp.kzjp4.sandbox5236.opentlc.com"
            - name: AGENT_BACKEND
              value: "openai_compatible"
            - name: OPENAI_API_BASE
              value: "https://gemma-4-31b-it-kserve-workload-svc.ai-project.svc.cluster.local:8000/v1"
            - name: AGENT_MODEL
              value: "gemma-4-31b-it"
            - name: OPENAI_API_KEY
              value: "not-used"
            - name: SSL_CERT_FILE
              value: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              # qiskit-aer compila circuitos em memória; 1Gi é o mínimo seguro
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
