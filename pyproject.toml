[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-encoding-agents"
version = "0.1.0"
description = "Agentes de IA para recomendação e simulação de encoding de dados quânticos com Qiskit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ana Paula Appel", email = "aappel@redhat.com" }]
keywords = ["qiskit", "quantum-machine-learning", "agents", "encoding", "openshift", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "llama_stack_client>=0.1.0",
    "numpy>=1.24",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "python-dotenv>=1.0",
    "matplotlib>=3.7",
    "qiskit-machine-learning>=0.7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7",
    "ruff>=0.1",
]

[project.urls]
Repository = "https://github.com/anapaulaappel/quantum-encoding-agents"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
